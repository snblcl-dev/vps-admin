# =============================================
#  Panel de Administracion VPS - Configuracion
# =============================================

# Puerto base SSH
SSH_PORT=22

# Puerto alternativo SSH
SSH_ALT_PORT=443

# Puerto Dropbear
DROPBEAR_PORT=442

# Puerto Stunnel
STUNNEL_PORT=444

# Puerto WebSocket
WS_PORT=80

# Puerto V2Ray
V2RAY_PORT=8080

# Puerto BadVPN
BADVPN_PORT=7300

# Puerto Socks5
SOCKS5_PORT=1080

# Puerto SlowDNS
SLOWDNS_PORT=53

# Puerto FastDNS
FASTDNS_PORT=5300

# Rango de puertos para usuarios
USER_PORT_MIN=10000
USER_PORT_MAX=65000

# Tiempo por defecto de expiracion (dias)
DEFAULT_EXPIRY_DAYS=30

# Maximo de conexiones por usuario
MAX_CONNECTIONS_PER_USER=2

# Directorio de trabajo
INSTALL_DIR="/opt/script-cgh"

# Database
USERS_DB="/etc/script-cgh/usuarios.db"
BACKUP_DIR="/etc/script-cgh/backups"
